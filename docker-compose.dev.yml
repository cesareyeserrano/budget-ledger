# Ambiente de PRUEBAS reproducible (modo servidor) — un comando, cero setup.
#   docker compose -f docker-compose.dev.yml up -d --build      # levantar
#   docker compose -f docker-compose.dev.yml down               # parar (conserva datos)
#   docker compose -f docker-compose.dev.yml down -v            # parar + BORRAR datos
# App en http://localhost:3100 · Postgres en localhost:5432 (user/pass/db = ledger).
# NO es producción: usa un secreto de desarrollo fijo. Para producción usa docker-compose.yml.
services:
  db:
    image: postgres:16-alpine
    container_name: ledger-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ledger_devdata:/var/lib/postgresql/data
    ports:
      # RQ-SEC-006: atado a loopback. "5432:5432" publica en 0.0.0.0 — con credenciales fijas
      # (ledger/ledger), cualquiera en la misma red alcanzaba la BD financiera.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # Ya no se inlinea ningún flag de modo: el interruptor de rollout se retiró y Postgres es la
      # única fuente de verdad (NFR-1107). El entrypoint del Dockerfile corre las migraciones
      # (idempotentes) antes de servir.
    image: t-ledger-dev:latest
    container_name: ledger-dev-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      # Secreto de DESARROLLO (no producción; el marcador lo excluye del gate de secretos).
      BETTER_AUTH_SECRET: dev-secret-not-for-production-do-not-use-000000
      BETTER_AUTH_URL: http://localhost:3100
      # Google deshabilitado (sin credenciales); el botón se muestra deshabilitado.
      NEXT_PUBLIC_GOOGLE_ENABLED: "false"
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Visor web de la BD (pgweb): se conecta solo vía DATABASE_URL, SIN LOGIN. http://localhost:8081
  # Por eso va atado a loopback (RQ-SEC-006): publicado en 0.0.0.0 era un navegador completo de la
  # base de datos, sin autenticación, para cualquiera en la misma red.
  db-viewer:
    image: sosedoff/pgweb:latest
    container_name: ledger-dev-pgweb
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"

  # Buzón de correo de DESARROLLO (feature recuperar-acceso, FR-1305). Captura todo lo que la app
  # envía y no deja salir nada a Internet: el enlace de recuperación se lee en http://localhost:8025
  # en vez de en un buzón real. Ambos puertos atados a loopback, igual que la BD (RQ-SEC-006).
  mail:
    image: axllent/mailpit:latest
    container_name: ledger-dev-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP — apunta aquí SMTP_HOST/SMTP_PORT en .env.local
      - "127.0.0.1:8025:8025" # bandeja web + API HTTP que consultan los tests
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  ledger_devdata:
